name: WordPressに小説を投稿

on:
  workflow_dispatch:
    inputs:
      status:
        description: '投稿ステータス（draft=下書き / publish=公開）'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - publish

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: WordPressに投稿
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
        run: |
          CONTENT=$(cat content/madrid_finals_2.html)
          PAYLOAD=$(python3 -c "
import json, os, sys
title = '静かな螺旋　マドリード・オープン決勝'
content = open('content/madrid_finals_2.html').read()
status = '${{ inputs.status }}'
print(json.dumps({'title': title, 'content': content, 'status': status}))
")
          RESPONSE=$(curl -s -w '\n%{http_code}' \
            -X POST "${WP_URL}/wp-json/wp/v2/posts" \
            -u "${WP_USER}:${WP_PASS}" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          if [ "$HTTP_CODE" = "201" ]; then
            POST_ID=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
            echo "✅ 投稿成功！ ID: $POST_ID"
            echo "🔗 編集URL: ${WP_URL}/wp-admin/post.php?post=${POST_ID}&action=edit"
          else
            echo "❌ エラー (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi
